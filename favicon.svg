<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="preGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00086B" />
      <stop offset="100%" stop-color="#001438" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F26D03" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <!-- Background Shield Rounded Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#preGrad)" stroke="#1E295D" stroke-width="4" />

  <!-- Textile Precision Stitching Accents -->
  <rect x="12" y="12" width="104" height="104" rx="20" fill="none" stroke="#F26D03" stroke-width="2" stroke-dasharray="6,4" opacity="0.6" />

  <!-- Center Monogram "PRE" -->
  <g fill="#FFFFFF">
    <path d="M28 42 h16 c8 0 13 4 13 11 s-5 11 -13 11 h-8 v18 h-8 Z m8 15 h8 c3.5 0 5.5 -1.8 5.5 -4.5 s-2 -4.5 -5.5 -4.5 h-8 Z" />
  </g>

  <g fill="#F26D03">
    <!-- Letter R -->
    <path d="M57 42 h16 c7.5 0 12 3.8 12 10.5 c0 5.2 -3.2 8.5 -7.8 9.8 l9.2 19.7 h-9.2 l-8.2 -18 h-4 v18 h-8 Z m8 15 h8 c3 0 5 -1.6 5 -4.2 s-2 -4.3 -5 -4.3 h-8 Z" />
  </g>

  <g fill="#FFFFFF">
    <!-- Letter E -->
    <path d="M86 42 h20 v7 h-12 v10 h10 v7 h-10 v11 h12 v7 h-20 Z" />
  </g>

  <!-- High-visibility safety orange dot -->
  <circle cx="106" cy="79" r="4.5" fill="url(#orangeGrad)" />
</svg>
